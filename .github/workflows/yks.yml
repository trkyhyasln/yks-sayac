name: YKS Countdown Bot

on:
  schedule:
    - cron: '0 5 * * *'  # Her gün UTC 05:00'te (Türkiye saatiyle 08:00'de) çalışır
  workflow_dispatch:

jobs:
  send-message:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run script
        run: python main.py
        
